<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3dfa8"/>
      <stop offset="45%" stop-color="#c8a24d"/>
      <stop offset="100%" stop-color="#a9823a"/>
    </linearGradient>
    <linearGradient id="forestGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123a33"/>
      <stop offset="100%" stop-color="#071e1a"/>
    </linearGradient>
  </defs>

  <circle cx="60" cy="60" r="58" fill="url(#forestGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- horizon line -->
  <path d="M14 74 H106" stroke="#f3dfa833" stroke-width="1.5"/>

  <!-- stylised bull horns / wings mark, representing livestock + onward movement -->
  <path
    d="M22 76
       C 30 52, 40 44, 46 50
       C 50 40, 58 34, 60 44
       C 62 34, 70 40, 74 50
       C 80 44, 90 52, 98 76"
    fill="none"
    stroke="url(#goldGrad)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- ascending export arrow -->
  <path d="M60 68 L60 92 M60 68 L50 78 M60 68 L70 78" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.001"/>

  <!-- three rising dots symbolising growth / route points -->
  <circle cx="60" cy="46" r="3.2" fill="url(#goldGrad)"/>
  <circle cx="34" cy="80" r="2.2" fill="#f3dfa8" opacity="0.85"/>
  <circle cx="86" cy="80" r="2.2" fill="#f3dfa8" opacity="0.85"/>
</svg>
